[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veddata"
version = "0.1.2"
description = "MCP server for AI agents: discover a web page's data sources — network APIs, embedded data, scripts — and drive the page to reach them"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "ShanZhi", email = "SanZiNEO@outlook.com"},
]
keywords = ["mcp", "mcp-server", "ai-agent", "scraping", "web-scraping", "api-discovery", "data-extraction", "network", "playwright", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "playwright>=1.48",
    "httpx>=0.27",
    "fastmcp>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/SanZiNEO/veddata"
Repository = "https://github.com/SanZiNEO/veddata.git"
Issues = "https://github.com/SanZiNEO/veddata/issues"

[project.scripts]
veddata = "veddata.server:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
